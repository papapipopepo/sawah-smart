[tool.poetry]
name = "padi-harvest-detection"
version = "0.1.0"
description = "Sistem Deteksi Kesiapan Panen Padi — IoT ESP32-CAM + Indeks Vegetasi + LLM Vision"
authors = ["Ezra Ariel <ezra.ariel1221@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
streamlit = ">=1.35.0"
openai = ">=1.30.0"
langfuse = ">=2.0.0"
opencv-python-headless = ">=4.9.0"
scikit-image = ">=0.22.0"
scikit-learn = ">=1.4.0"
imbalanced-learn = ">=0.12.0"
numpy = ">=1.26.0"
pandas = ">=2.2.0"
matplotlib = ">=3.8.0"
pillow = ">=10.3.0"
joblib = ">=1.4.0"
python-dotenv = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6.29.0"
jupyterlab = ">=4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
